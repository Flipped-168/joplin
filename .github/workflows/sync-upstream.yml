name: Sync laurent22/joplin
on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Git config
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Add laurent22/joplin
        run: git remote add laurent22/joplin https://github.com/laurent22/joplin.git || true
      - name: Fetch laurent22/joplin
        run: git fetch laurent22/joplin
      - name: Merge laurent22/joplin (ours strategy)
        run: |
          git merge laurent22/joplin/HEAD --no-edit -X ours || git merge FETCH_HEAD --no-edit -X ours || true
          git diff --name-only --diff-filter=U | while IFS= read -r f; do
            case "$f" in
              .github/workflows/sync-laurent22/joplin.yml) ;;
              .github/workflows/*) git rm -f "$f" ;;
              *) git checkout --ours -- "$f" || true ;;
            esac
          done
      - name: Keep only our workflow
        run: |
          mkdir -p .github/workflows
          find .github/workflows -type f ! -name "sync-laurent22/joplin.yml" -delete
      - name: Commit and push
        run: |
          git add -f .github/workflows
          git commit -m "chore: preserve fork sync workflow" --allow-empty
          git push